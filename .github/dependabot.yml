version: 2
updates:
  - package-ecosystem: "nuget"
    # Library projects under src/ are excluded: their versions are the minimums
    # consumers need, raised only for a security advisory or a required API.
    directories:
      - "/tests/AuthEndpoints.Tests"
      - "/tests/AuthEndpoints.External.OAuth.Tests"
      - "/tests/AuthEndpoints.External.OAuth.ShimSmoke"
    schedule:
      interval: "weekly"
    rebase-strategy: auto
    groups:
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/Documentation"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
