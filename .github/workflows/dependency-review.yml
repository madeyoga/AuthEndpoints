name: Dependency review

on:
  pull_request:
    branches: [ main, "release/**" ]

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            deps:
              - '**/*.csproj'
              - '**/Directory.Packages.props'
              - 'Directory.*.props'
              - '**/packages.lock.json'
              - 'Documentation/package.json'
              - 'Documentation/pnpm-lock.yaml'
              - '.github/workflows/**'

  review:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Compares the pull request diff. Advisories already on the base branch do not fail this check.
          fail-on-severity: high
