name: Publish Nuget Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for NuGet trusted publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Restore Dependencies
        run: dotnet restore AuthEndpoints.sln

      - name: Run Tests
        run: dotnet test AuthEndpoints.sln --configuration Release --verbosity minimal

      - name: Clean
        run: |
          dotnet clean AuthEndpoints.sln -c Release
          rm -rf **/bin **/obj nupkgs

      - name: Build
        run: dotnet build AuthEndpoints.sln -c Release --no-restore

      - name: Create Output Directory
        run: mkdir nupkgs

      - name: Make Nuget Packages
        run: dotnet pack AuthEndpoints.sln -c Release --no-build --output nupkgs

      - name: List Generated Packages
        run: ls -la nupkgs/

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        with:
          # nuget.org profile username (NOT email)
          user: ${{ secrets.NUGET_USER }}

      - name: Publish To Nuget
        run: >
          dotnet nuget push nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
