name: Publish Nuget Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for NuGet trusted publishing (OIDC) and build provenance
      attestations: write # Publish build provenance for the packed packages
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.x

      # The tag prefix picks the packages: v* (AuthEndpoints, EntityFrameworkCore), external-oauth-v* (External.OAuth,
      # OAuth.GitHub, OAuth.Google), openiddict-v* (OpenIddict, OpenIddict.EntityFrameworkCore). Fails on an unknown prefix, a tag
      # that doesn't match <Version>, or a pre-release flag that doesn't match the version.
      - name: Select packages for this tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          bash .github/scripts/release-packages.sh "$TAG" "$PRERELEASE" > "$RUNNER_TEMP/release-projects.txt"
          cat "$RUNNER_TEMP/release-projects.txt"

      - name: Restore Dependencies
        run: dotnet restore AuthEndpoints.sln --locked-mode

      - name: Run Tests
        run: dotnet test AuthEndpoints.sln --configuration Release --verbosity minimal

      - name: Clean
        run: |
          dotnet clean AuthEndpoints.sln -c Release
          rm -rf nupkgs

      - name: Build
        run: dotnet build AuthEndpoints.sln -c Release --no-restore

      - name: Make Nuget Packages
        run: |
          mkdir nupkgs
          while IFS= read -r project; do
            dotnet pack "$project" -c Release --no-build --output nupkgs
          done < "$RUNNER_TEMP/release-projects.txt"
          expected=$(wc -l < "$RUNNER_TEMP/release-projects.txt")
          actual=$(find nupkgs -name '*.nupkg' | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Packed $actual packages for $expected projects."
            exit 1
          fi

      - name: List Generated Packages
        run: ls -la nupkgs/

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: nupkgs/*.nupkg

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        with:
          # nuget.org profile username (NOT email)
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate lets a re-run finish an earlier partial push. A run that pushes nothing
      # fails, so a forgotten version bump can't pass as a release.
      - name: Publish To Nuget
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          pushed=0
          for package in nupkgs/*.nupkg; do
            output=$(dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate 2>&1) || { echo "$output"; exit 1; }
            echo "$output"
            if grep -q "Your package was pushed" <<< "$output"; then
              pushed=$((pushed + 1))
            fi
          done
          if [ "$pushed" -eq 0 ]; then
            echo "::error::Every package for this tag is already on NuGet. Nothing was pushed."
            exit 1
          fi
          echo "Pushed $pushed package(s)."
