name: Publish Nuget Packages

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for NuGet trusted publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore Dependencies
        run: dotnet restore AuthEndpoints.sln

      - name: Run Tests
        run: dotnet test AuthEndpoints.sln --configuration Release --verbosity minimal

      - name: Clean
        run: |
          dotnet clean AuthEndpoints.sln -c Release
          rm -rf **/bin **/obj nupkgs

      - name: Build
        run: dotnet build AuthEndpoints.sln -c Release --no-restore

      - name: Create Output Directory
        run: mkdir nupkgs

      - name: Make Nuget Packages
        run: dotnet pack AuthEndpoints.sln -c Release --no-build --output nupkgs

      - name: List Generated Packages
        run: ls -la nupkgs/

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org profile username (NOT email)
          user: ${{ secrets.NUGET_USER }}

      - name: Publish To Nuget
        run: >
          dotnet nuget push nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
