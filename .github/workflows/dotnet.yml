name: .NET

on:
  push:
    branches: [ main ]
  # pull_request:
  #  branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Restore dependencies
      run: dotnet restore AuthEndpoints.sln
    - name: Build
      run: dotnet build AuthEndpoints.sln --no-restore
    - name: Test
      # console logger lists each test by name; MSBuild -v minimal keeps build noise down
      run: dotnet test AuthEndpoints.sln --no-build -v minimal --logger "console;verbosity=detailed"
