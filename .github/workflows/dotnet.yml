name: .NET

on:
  push:
    branches: [ main ]
    paths:
      - 'src/AuthEndpoints/**'
      - 'src/AuthEndpoints.External.OAuth/**'
      - 'src/AuthEndpoints.OAuth.GitHub/**'
      - 'src/AuthEndpoints.OAuth.Google/**'
      - 'tests/AuthEndpoints.Tests/**'
      - 'tests/AuthEndpoints.External.OAuth.Tests/**'
      - 'AuthEndpoints.sln'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ main, "release/**" ]
    paths:
      - 'src/AuthEndpoints/**'
      - 'src/AuthEndpoints.External.OAuth/**'
      - 'src/AuthEndpoints.OAuth.GitHub/**'
      - 'src/AuthEndpoints.OAuth.Google/**'
      - 'tests/AuthEndpoints.Tests/**'
      - 'tests/AuthEndpoints.External.OAuth.Tests/**'
      - 'AuthEndpoints.sln'
      - '.github/workflows/dotnet.yml'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: 10.x
    - name: Restore dependencies
      run: dotnet restore AuthEndpoints.sln
    - name: Build
      run: dotnet build AuthEndpoints.sln --no-restore
    - name: Test
      # console logger lists each test by name; MSBuild -v minimal keeps build noise down
      run: dotnet test AuthEndpoints.sln --no-build -v minimal --logger "console;verbosity=detailed"
