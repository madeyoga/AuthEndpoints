name: .NET

on:
  push:
    branches: [ main ]
    paths:
      - 'src/AuthEndpoints/**'
      - 'src/AuthEndpoints.External.OAuth/**'
      - 'src/AuthEndpoints.OAuth.GitHub/**'
      - 'src/AuthEndpoints.OAuth.Google/**'
      - 'tests/AuthEndpoints.Tests/**'
      - 'tests/AuthEndpoints.External.OAuth.Tests/**'
      - 'AuthEndpoints.sln'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ main, "release/**" ]
    paths:
      - 'src/AuthEndpoints/**'
      - 'src/AuthEndpoints.External.OAuth/**'
      - 'src/AuthEndpoints.OAuth.GitHub/**'
      - 'src/AuthEndpoints.OAuth.Google/**'
      - 'tests/AuthEndpoints.Tests/**'
      - 'tests/AuthEndpoints.External.OAuth.Tests/**'
      - 'AuthEndpoints.sln'
      - '.github/workflows/dotnet.yml'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: 10.x
    - name: Restore dependencies
      run: dotnet restore AuthEndpoints.sln --locked-mode
    - name: Build
      run: dotnet build AuthEndpoints.sln --no-restore
    - name: Test
      # console logger lists each test by name; MSBuild -v minimal keeps build noise down
      run: dotnet test AuthEndpoints.sln --no-build -v minimal --logger "console;verbosity=detailed"
