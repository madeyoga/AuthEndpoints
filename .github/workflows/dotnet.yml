name: .NET

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.slnx'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - '[Nn]u[Gg]et.[Cc]onfig'
      - '**/packages.lock.json'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ main, "release/**" ]

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - '*.sln'
              - '*.slnx'
              - 'Directory.*.props'
              - 'Directory.*.targets'
              - 'global.json'
              - '[Nn]u[Gg]et.[Cc]onfig'
              - '**/packages.lock.json'
              - '.github/workflows/dotnet.yml'

  build:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.dotnet == 'true') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: 10.x
    - name: Restore dependencies
      run: dotnet restore AuthEndpoints.sln --locked-mode
    - name: Build
      run: dotnet build AuthEndpoints.sln --no-restore
    - name: Test
      # console logger lists each test by name; MSBuild -v minimal keeps build noise down
      run: dotnet test AuthEndpoints.sln --no-build -v minimal --logger "console;verbosity=detailed"
